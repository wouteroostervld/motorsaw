# Motorsaw Global Configuration
# Location: ~/.motorsaw/config.yaml
#
# All of this is optional: without a configuration file motorsaw keeps the
# code graph and skips node_modules, vendor and __pycache__.

version: "3"

# The active profile to use
active_profile: "default"

profiles:
  default:
    # --- Where ---
    # Directories the daemon watches
    include:
      - "~/projects"

    # Directory names skipped by grep, index and the daemon
    exclude:
      - "node_modules"
      - "vendor"
      - "build"
      - "dist"

    # What git ignores (.gitignore, .git/info/exclude) is left out as well.
    # Say false to keep it; a project can say so for itself in .config.yaml.
    # gitignore: true

    # Files never indexed (regular expressions on the absolute path) ...
    blacklist:
      - ".*\\.min\\.js$"
      - ".*\\.pb\\.go$"
    # ... except these
    whitelist: []

    # --- What ---
    # The kinds of index to keep. Each works alone; a kind left out keeps
    # its default. A project can switch them for itself in a .config.yaml.
    index:
      graph: true        # definitions, calls, imports: for "motorsaw query"
      embeddings: false  # a vector per chunk of code: for "motorsaw search"

    # Where the references of a project may lead outside it. By default
    # nowhere: a call is matched with the definitions of its own project
    # (its repository). What is named here is followed through imports, if
    # it is in the index. A project can set this in its .config.yaml.
    # follow:
    #   - venv       # the project's Python virtual environment, or the active one
    #   - go         # the Go standard library and the module cache
    #   - headers    # the header files of the system
    #   - ~/src/lib  # any directory

    # The model that makes embeddings. Only needed, and only used, where the
    # embeddings index is on. Naming a model switches nothing on.
    embeddings:
      model: "nomic-embed-text"            # served by Ollama on localhost
      # base_url: "http://localhost:11434"

    # --- The daemon ---
    # When it starts, the daemon brings the index up to date with the
    # included directories, since watching only shows what changes later.
    daemon:
      scan: true            # false: only index what changes from now on
      scan_kinds: [graph]   # add embeddings to have the scan make those too

  # A profile that embeds everything, with a hosted model
  semantic:
    include:
      - "~/projects"
    exclude:
      - "node_modules"
    index:
      embeddings: true
    embeddings:
      base_url: "https://api.openai.com/v1"   # any OpenAI-compatible server
      api_key: "sk-..."
      model: "text-embedding-3-small"
